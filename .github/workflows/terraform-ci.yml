name: Terraform CI - Análisis de Calidad y Seguridad

on:
  pull_request:
    branches:
      - main

jobs:
  analisis-estatico:
    name: "1. Análisis Estático - TFLint"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: Inicializar TFLint
        run: tflint --init
        working-directory: ./terraform

      - name: Ejecutar TFLint
        run: tflint --format compact
        working-directory: ./terraform

  analisis-seguridad:
    name: "2. Análisis de Seguridad - Checkov"
    runs-on: ubuntu-latest
    needs: analisis-estatico
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Ejecutar Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          soft_fail: true

  validacion-terraform:
    name: "3. Validación Terraform"
    runs-on: ubuntu-latest
    needs: analisis-seguridad
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.9"

      - name: Terraform Init
        run: terraform init -backend=false
        working-directory: ./terraform

      - name: Terraform Validate
        run: terraform validate
        working-directory: ./terraform